name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run of the previous push. Runs on main each get a
# group of their own: a release tag needs a green run at its own commit, and a shared group
# would let GitHub drop a pending main run when the next merge lands.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # A clean checkout has no lint or format cache, so CI always runs the full checks.
      - name: Run quality checks
        run: bun run check

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit and integration tests
        run: bun run test

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: Run E2E tests (shard ${{ matrix.shard }} of 3)
        run: bun run test:e2e --shard=${{ matrix.shard }}/3
